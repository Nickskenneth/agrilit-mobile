name: agrilit_mobile
description: Platform Literasi Pertanian - AgriLit
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== HTTP & API =====
  http: ^1.2.1 # HTTP client untuk hit Laravel API

  # ===== STATE MANAGEMENT =====
  provider: ^6.1.2 # State management sederhana & cukup untuk thesis

  # ===== LOCAL STORAGE =====
  sqflite: ^2.3.3 # SQLite untuk offline cache
  path_provider: ^2.1.3 # Lokasi direktori file
  shared_preferences: ^2.2.3 # Simpan token & settings sederhana

  # ===== NAVIGASI =====
  go_router: ^14.2.0 # Declarative routing

  # ===== KAMERA & FILE =====
  image_picker: ^1.1.2 # Ambil foto dari kamera/galeri
  image: ^4.1.7 # Kompresi gambar sebelum upload

  # ===== LOKASI (GPS) =====
  geolocator: ^12.0.0 # Ambil koordinat GPS

  # ===== UI COMPONENTS =====
  cached_network_image: ^3.3.1 # Cache gambar dari URL
  flutter_html: ^3.0.0 # Render konten HTML artikel
  shimmer: ^3.0.0 # Loading skeleton effect

  # ===== TEXT TO SPEECH =====
  flutter_tts: ^4.0.2 # Fitur TTS untuk artikel

  # ===== PDF =====
  pdf: ^3.10.8 # Generate PDF dari SOP
  printing: ^5.13.1 # Print/share PDF

  # ===== CONNECTIVITY =====
  connectivity_plus: ^6.0.3 # Deteksi online/offline

  # ===== UTILITAS =====
  intl: ^0.19.0 # Format tanggal bahasa Indonesia
  flutter_dotenv: ^5.1.0 # Environment variables
  # flutter_html_iframe: ^3.0.0  # Dihapus: tidak support web (platformViewRegistry deprecated)
  # webview_flutter: ^4.13.1     # Tidak dipakai langsung di kode
  sqflite_common_ffi_web: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
